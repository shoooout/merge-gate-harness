name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # macOS では実行しない。GitHub の macOS の実行環境は混雑していて、割り当てられないままジョブが
  # 取り消されることがあり、コードに問題がなくても CI が失敗になる。
  # macOS 標準の bash 3.2 での動作は、push の前に手元で tests/run.sh を実行して確かめる。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # -P SCRIPTDIR: source するファイルの相対パスを、実行時のディレクトリではなくスクリプトの場所から解決する。
      # -S warning: 情報レベルの指摘では落とさない。JSON に埋めたシェルの変数を単一引用符で囲む、
      # trap から呼ぶ関数を定義する、といった意図した書き方が情報レベルで指摘されるため。
      - run: shellcheck -x -P SCRIPTDIR -S warning scripts/lib/*.sh scripts/checks/*.sh scripts/hooks/*.sh scripts/*.sh tests/*.sh
