name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # 利用者の手元は macOS 標準の bash 3.2、CI は Linux の新しい bash なので、両方で確かめる
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x scripts/lib/*.sh scripts/checks/*.sh scripts/hooks/*.sh scripts/*.sh tests/*.sh
