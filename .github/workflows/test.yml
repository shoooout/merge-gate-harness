name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # 利用者の手元は macOS 標準の bash 3.2、CI は Linux の新しい bash なので、両方で確かめる
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # -P SCRIPTDIR: source するファイルの相対パスを、実行時のディレクトリではなくスクリプトの場所から解決する。
      # -S warning: 情報レベルの指摘では落とさない。JSON に埋めたシェルの変数を単一引用符で囲む、
      # trap から呼ぶ関数を定義する、といった意図した書き方が情報レベルで指摘されるため。
      - run: shellcheck -x -P SCRIPTDIR -S warning scripts/lib/*.sh scripts/checks/*.sh scripts/hooks/*.sh scripts/*.sh tests/*.sh
