# 対象リポジトリの .github/workflows/merge-gate.yml に置く例。
# branch protection で、このジョブを必須のステータスチェックにする。
name: merge-gate

on:
  pull_request:
  # 人間の確認が必要な区分では、承認が付いた時点で判定をやり直す必要がある
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 分岐元との差分を取るので、履歴をすべて取得する
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # ここに、対象リポジトリの言語の実行環境と依存を用意するステップを置く。
      # .merge-gate.json の checks に書いたコマンドが、この環境で動く必要がある。

      # main を指定して、常に最新の検査を使う。手元のプラグインと同じ版の検査を CI でも実行するためである。
      # 特定の版に固定したいときは、main の代わりにタグか commit SHA を指定する。
      - uses: shoooout/merge-gate-harness@main
        with:
          github-token: ${{ github.token }}
