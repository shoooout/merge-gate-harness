name: merge-gate
description: AI が書いた変更を、人間が diff を読まずにマージしてよいかを判定する。PR 本文の確認、秘密の値の検出、リスクの分類を行う。

# テストや型検査は実行しない。対象リポジトリの既存の CI が実行しているので、ここでも実行すると二重になる。
#
# 呼び出し側のジョブで、対象リポジトリを fetch-depth: 0 で checkout してから、このアクションをステップとして呼ぶ。
# 分岐元との差分を取るので、履歴が浅いと判定できない。
# テストが変更を検出できるかの確認(checks.red)を使う場合は、テストを実行できる環境も先に用意する。
# 既存のテストのジョブの末尾にこのステップを足せば、環境の用意を二重にせずに済む。
#
# PR に対する実行でだけ判定する。同じ workflow が push でも動く場合、push での実行では何もしない。
#
# 人間の確認が必要な区分でも、このアクションは失敗しない。警告で理由を示すだけである。
# 人間の承認があるまでマージさせないことは、対象リポジトリの branch protection に任せる。
# ここでも承認を確かめると、レビューを待っているだけの PR が失敗として表示され、
# 仕様の不備や秘密の値の検出のような、承認があっても通してはいけない失敗と見分けにくくなる。

outputs:
  auto-merge:
    description: 人間が diff を読まずにマージしてよい区分なら true。
    value: ${{ steps.classify.outputs.auto_merge }}

runs:
  using: composite
  steps:
    - name: PR の本文に、仕様と引き継ぎの情報があるかを確かめる
      if: github.event.pull_request
      shell: bash
      env:
        # 本文は利用者が自由に書ける文字列なので、スクリプトに直接展開せず環境変数で渡す。
        # 直接展開すると、本文に書かれたシェルの構文がそのまま実行される。
        PR_BODY: ${{ github.event.pull_request.body }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        # 本文の検証の結果が、どの変更に対するものかを照合するために使う。
        # checkout されているコミットではなく PR の先頭のコミットを渡すのは、呼び出し側が
        # base ブランチとの merge コミットを checkout していることがあるためである。
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        body_file="$(mktemp)"
        printf '%s\n' "$PR_BODY" >"$body_file"
        status=0
        bash "$GITHUB_ACTION_PATH/scripts/checks/spec.sh" "$body_file" "origin/$BASE_REF" || status=1
        bash "$GITHUB_ACTION_PATH/scripts/checks/handoff.sh" --commit "$HEAD_SHA" "$body_file" "origin/$BASE_REF" || status=1
        exit "$status"

    - name: 秘密の値が追加されていないかを確かめる
      if: github.event.pull_request
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: bash "$GITHUB_ACTION_PATH/scripts/checks/secrets.sh" "origin/$BASE_REF"

    - name: 人間の確認が必要な変更かを分類する
      id: classify
      if: github.event.pull_request
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        set +e
        reasons="$(bash "$GITHUB_ACTION_PATH/scripts/checks/classify.sh" "origin/$BASE_REF")"
        status=$?
        if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
          printf '%s\n' "$reasons"
          exit "$status"
        fi

        # テストが今回の変更を検出できるかを確かめる。検出できない変更は、テストが通ったことが
        # 根拠にならないので、人間の確認が必要な区分に入れる。
        red_reason="$(bash "$GITHUB_ACTION_PATH/scripts/checks/red.sh" --in-place "origin/$BASE_REF")"
        red_status=$?
        if [ "$red_status" -eq 3 ]; then
          reasons="$(printf '%s\n%s' "$reasons" "$red_reason" | sed '/^$/d')"
          status=3
        elif [ "$red_status" -ne 0 ]; then
          printf '%s\n' "$red_reason"
          exit "$red_status"
        fi
        set -e
        if [ "$status" -eq 0 ]; then
          echo "auto_merge=true" >>"$GITHUB_OUTPUT"
          echo "人間が diff を読まずにマージしてよい区分である。" >>"$GITHUB_STEP_SUMMARY"
        elif [ "$status" -eq 3 ]; then
          echo "auto_merge=false" >>"$GITHUB_OUTPUT"
          {
            echo "### 人間の確認が必要な理由"
            printf '%s\n' "$reasons" | sed 's/^/- /'
          } >>"$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$reasons" | sed 's/^/::warning title=人間が diff を確認する必要がある::/'
        else
          printf '%s\n' "$reasons"
          exit "$status"
        fi
