name: merge-gate
description: AI が書いた変更を、人間が diff を読まずにマージしてよいかを判定する。検査、PR 本文の確認、リスクの分類を行う。

# 呼び出し側のジョブで、対象リポジトリを fetch-depth: 0 で checkout し、言語の実行環境と依存を
# 用意してから、このアクションをステップとして呼ぶ。分岐元との差分を取るので、履歴が浅いと判定できない。

inputs:
  github-token:
    description: PR のレビューを読むためのトークン。人間の承認があるかどうかの確認に使う。
    required: true

outputs:
  auto-merge:
    description: 人間が diff を読まずにマージしてよい区分なら true。
    value: ${{ steps.classify.outputs.auto_merge }}

runs:
  using: composite
  steps:
    - name: 検査を実行する
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/checks/verify.sh" --ci

    - name: PR の本文に、仕様と引き継ぎの情報があるかを確かめる
      shell: bash
      env:
        # 本文は利用者が自由に書ける文字列なので、スクリプトに直接展開せず環境変数で渡す。
        # 直接展開すると、本文に書かれたシェルの構文がそのまま実行される。
        PR_BODY: ${{ github.event.pull_request.body }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        body_file="$(mktemp)"
        printf '%s\n' "$PR_BODY" >"$body_file"
        status=0
        bash "$GITHUB_ACTION_PATH/scripts/checks/spec.sh" "$body_file" "origin/$BASE_REF" || status=1
        bash "$GITHUB_ACTION_PATH/scripts/checks/handoff.sh" "$body_file" || status=1
        exit "$status"

    - name: 秘密の値が追加されていないかを確かめる
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: bash "$GITHUB_ACTION_PATH/scripts/checks/secrets.sh" "origin/$BASE_REF"

    - name: 人間の確認が必要な変更かを分類する
      id: classify
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        set +e
        reasons="$(bash "$GITHUB_ACTION_PATH/scripts/checks/classify.sh" "origin/$BASE_REF")"
        status=$?
        if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
          printf '%s\n' "$reasons"
          exit "$status"
        fi

        # テストが今回の変更を検出できるかを確かめる。検出できない変更は、検査が通ったことが
        # 根拠にならないので、人間の確認が必要な区分に入れる。
        red_reason="$(bash "$GITHUB_ACTION_PATH/scripts/checks/red.sh" --in-place "origin/$BASE_REF")"
        red_status=$?
        if [ "$red_status" -eq 3 ]; then
          reasons="$(printf '%s\n%s' "$reasons" "$red_reason" | sed '/^$/d')"
          status=3
        elif [ "$red_status" -ne 0 ]; then
          printf '%s\n' "$red_reason"
          exit "$red_status"
        fi
        set -e
        if [ "$status" -eq 0 ]; then
          echo "auto_merge=true" >>"$GITHUB_OUTPUT"
          echo "人間が diff を読まずにマージしてよい区分である。" >>"$GITHUB_STEP_SUMMARY"
        elif [ "$status" -eq 3 ]; then
          echo "auto_merge=false" >>"$GITHUB_OUTPUT"
          {
            echo "### 人間の確認が必要な理由"
            printf '%s\n' "$reasons" | sed 's/^/- /'
          } >>"$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$reasons"
        else
          printf '%s\n' "$reasons"
          exit "$status"
        fi

    - name: 人間の確認が必要な変更に、人間の承認があるかを確かめる
      if: steps.classify.outputs.auto_merge == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # 承認のあとにコミットが積まれた場合は、その承認を数えない。
        # 承認を得てから別の変更を足す形で、確認されていない変更を通せないようにする。
        approvals="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" |
          jq -s --arg sha "$HEAD_SHA" \
            '[.[][] | select(.state == "APPROVED" and .commit_id == $sha and .user.type == "User")] | length')"
        if [ "$approvals" -eq 0 ]; then
          echo "::error::この変更は人間の確認が必要な区分だが、最新のコミットに対する人間の承認がない。"
          exit 1
        fi
        echo "最新のコミットに対する人間の承認が $approvals 件ある。"
